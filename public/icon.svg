<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Gatehouse: a raised barrier gate — the one thing every vehicle passes. -->
  <rect width="512" height="512" rx="112" fill="#1f3a5f"/>
  <defs>
    <clipPath id="arm"><rect x="150" y="196" width="310" height="68" rx="34"/></clipPath>
  </defs>
  <g transform="translate(-26 18)">
    <!-- barrier arm, striped, raised -->
    <g transform="rotate(-22 172 230)">
      <rect x="150" y="196" width="310" height="68" rx="34" fill="#ffffff"/>
      <g clip-path="url(#arm)" fill="#e5484d">
        <rect x="236" y="180" width="46" height="100" transform="skewX(-25)"/>
        <rect x="330" y="180" width="46" height="100" transform="skewX(-25)"/>
        <rect x="424" y="180" width="46" height="100" transform="skewX(-25)"/>
        <rect x="518" y="180" width="46" height="100" transform="skewX(-25)"/>
      </g>
    </g>
    <!-- post -->
    <rect x="118" y="196" width="104" height="196" rx="20" fill="#ffffff"/>
    <circle cx="170" cy="240" r="26" fill="#ffd400"/>
    <!-- road -->
    <rect x="86" y="382" width="372" height="24" rx="12" fill="#ffd400"/>
  </g>
</svg>
